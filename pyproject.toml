[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "0.1.0"
description = "Phishing URL/email classifier inference service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "scikit-learn==1.6.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.4",
    "tldextract>=5.1",
    "python-whois>=0.9",
    "httpx>=0.27",
    "structlog>=24.1",
    "idna>=3.7",
]

[project.optional-dependencies]
train = [
    "pyarrow>=16",
]

dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "freezegun>=1.5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["features/data/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
files = ["app", "scripts"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "whois.*",
    "tldextract.*",
    "joblib.*",
    "pandas.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
