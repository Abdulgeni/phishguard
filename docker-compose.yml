services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: phishguard:local
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_PATH: /app/artifacts/model.joblib
      ENABLE_EXPLANATIONS: ${ENABLE_EXPLANATIONS:-false}
      REQUEST_BUDGET_SECONDS: ${REQUEST_BUDGET_SECONDS:-3}
      EMAIL_REQUEST_BUDGET_SECONDS: ${EMAIL_REQUEST_BUDGET_SECONDS:-10}
      WHOIS_DISABLED: ${WHOIS_DISABLED:-false}
      WHOIS_TIMEOUT_SECONDS: ${WHOIS_TIMEOUT_SECONDS:-2}
      WHOIS_FAKE_DELAY_SECONDS: ${WHOIS_FAKE_DELAY_SECONDS:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  app-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    image: phishguard:local
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_PATH: /app/artifacts/model.joblib
      WHOIS_DISABLED: ${WHOIS_DISABLED:-false}
    volumes:
      - ./artifacts:/app/artifacts:ro
